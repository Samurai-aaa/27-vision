# detector 装甲板检测参数（OpenVINO 推理 + PnP 解算）。
# 与 video_player.yaml 同款惯例：随包安装，launch 用 get_package_share_directory 定位。
# 工作区使用 colcon build --symlink-install 后，修改本文件并重启节点即可生效。
# 换视频要同时改两处：这里的 detect_color（打哪一方）+ video_player 的 video_path。
detector:
  ros__parameters:
    # 敌方颜色：0=打红车（配 red 视频）1=打蓝车（配 blue 视频）。
    #   设反的后果不是"检测精度下降"，而是 OpenvinoInfer 会把该颜色的板**整块丢掉**：
    #   /armors 照常发布但不含装甲板 → tracker 一直 LOST，无法产生跟踪框。
    detect_color: 0
    # 初筛与 NMS 共用低分候选阈值；tracker 用高分建轨、低分有限续轨。
    confidence_threshold: 0.35
    nms_threshold: 0.45

    # OpenVINO 推理设备：CPU / GPU / AUTO
    device: CPU

    # 发布 /armor_detector/final_img 标注图（rqt 里看检测效果）。
    # 这一项带 on_set 回调，运行中可直接切换：
    #   ros2 param set /armor_detector debug false
    debug: true

    # model_path 故意不在此处写死：节点用 ament_index 定位 share/detector/Model/，
    # 换机器 / 换安装路径都不用改这里。
