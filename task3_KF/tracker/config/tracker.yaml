# tracker_node 参数（整车 EKF：小陀螺车 4 板 / 前哨 3 板）
tracker_node:
  ros__parameters:
    # —— 整车数据关联双阈值门控 ——
    high_confidence: 0.65       # 建轨/可靠同号命中
    low_confidence: 0.35        # 弱候选，仅已确认轨迹可用
    min_class_margin: 1.0      # 原始类别 top1-top2 分差，不是概率
    primary_switch_frames: 3  # 主板连续缺失达到此帧数才移交绿框
    max_weak_frames: 8         # 无可靠命中时最多允许的弱续跟帧窗口
    max_reproj_error: 12.0    # 四角点重投影误差之和上限，px；待视频标定
    max_match_distance: 0.2    # 观测板心与整车预测板心的最大位置差，m
    max_match_yaw_diff: 1.0    # 观测板朝向与预测板朝向的最大角度差，rad

    # —— 整车初始化覆盖（0 = 按车牌默认：前哨 O→3板/半径0.2765，其余→4板/半径0.2）——
    # red.avi 哨兵 G 实测标定：4 板、板心到旋转轴半径 ≈ 0.31 m（同帧两板 3D 锚）
    armor_num: 4
    radius_init: 0.31

    # —— 状态机 ——
    tracking_thres: 5      # DETECTING → TRACKING 需要的**累计**命中帧数（容忍窗口内的漏检不清零）
    # 漏检容忍窗口：连续 max_miss_frames 帧无命中才回 LOST。多车并存 / 远距离 / 弱光下
    # detector 会成片丢板（blu.avi 实测有板帧只占 56%，最差一段仅 9%），逐帧判定会让
    # 目标在 LOST 上反复断流、画面时有时无。设 1 即退回"一漏就回 LOST"的旧行为。
    max_miss_frames: 15
    # TEMP_LOST 持续超过该秒数 → LOST。只在 /armors 断流（update 不再被调）时兜底：
    # 流还活着时由 max_miss_frames 按帧判定，所以这里给得比 N 帧对应的时长宽
    lost_time_thres: 1.5

    # LOST（含从未锁上）时是否也发原始帧 + LOST 标注到 /tracker/final_img。
    # true = 画面全程不断流（rqt 不定格、录制器不空等超时）；false = 旧行为，未锁定时不发帧。
    # 注意：这一项只影响出图，不伪造任何跟踪框
    publish_when_lost: true

    # 相机内参统一读取工作区 config/camera.yaml。
    armor_width: 0.13     # 绘制板宽（小装甲），m
    armor_height: 0.055   # 绘制板高，m
    # RM 装甲板默认上倾角：板面朝上仰、顶边略后仰（实测前向板法线 n_y≈-sin(上倾角)≈-0.24）。
    # 只影响板朝向/绘制/marker 的板倾，板心与相位不受（EKF 核心不动）。0 = 纯竖直板。
    plate_tilt_deg: 15.0

    # 可视化开关：左上整车状态 HUD（Kalman 状态实时文本）——
    show_hud: true

    # —— 需求⑤：未来状态外推可视化（只画框，不写进滤波/消息）——
    future_ms: 150.0    # 未来外推提前量 ms：白=模型现在，品红虚线= future_ms 后预测板
    show_future: false   # 画未来板框开关（掉帧外推/实测帧都叠这一层）
