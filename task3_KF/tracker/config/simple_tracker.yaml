# simple_tracker_node 参数（需求①② 单板普通 KF：CV 6 维 / CA 9 维，独立话题与整车 EKF 并行）
simple_tracker_node:
  ros__parameters:
    # —— 运动模型（需求② CV/CA 对比实验主调参数）——
    model: CV                  # 'CV' 匀速 6 维 / 'CA' 匀加速 9 维；换模型改这里即可
    v1: 1.0                    # 过程噪声强度：CV=加速度方差，CA=加加速度(jerk)方差。
                               #   量级参照：直线板心加速度 std ~1 m/s² → v1=1。机动大调大、匀速调小

    # —— 数据关联 / 状态机 ——
    max_match_distance: 0.2    # 同号板距 KF 预测板心的最近位置门控，m（防串到邻板/换号板）
    lost_time_thres: 0.3       # 连续无同号命中超过该秒数 → 回 LOST，重新锁车号

    # —— 渲染用相机内参（与 detector 标定一致，1440×1080）——
    fx: 2556.2545862166521
    fy: 2553.5331992802749
    cx: 705.83803766013978
    cy: 584.62889512335437
    armor_width: 0.13          # 绘制板宽（小装甲），m
    armor_height: 0.055        # 绘制板高，m

    # 可视化开关：左上 HUD（KF 状态实时文本）——
    show_hud: true
